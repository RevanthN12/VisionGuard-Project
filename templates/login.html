<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionGuard — Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="glass-panel p-4 p-md-5 style-card" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-eye-low-vision text-primary display-4 mb-2"></i>
            <h3 class="fw-bold m-0">VisionGuard AI</h3>
            <p class="text-secondary small">Diabetic Retinopathy Detection Platform</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-secondary border-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control bg-dark text-white border-secondary" placeholder="admin or doctor" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-secondary border-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"><i class="fa-solid fa-right-to-bracket me-2"></i> Log In</button>
        </form>

        <div class="text-center my-3 text-secondary small">— Quick Demo Auto-Login —</div>

        <div class="d-flex gap-2">
            <button class="btn btn-outline-info w-50 btn-sm" onclick="autoLogin('doctor')"><i class="fa-solid fa-user-doctor"></i> Login as Doctor</button>
            <button class="btn btn-outline-warning w-50 btn-sm" onclick="autoLogin('admin')"><i class="fa-solid fa-user-shield"></i> Login as Admin</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect || '/dashboard';
            } else {
                const alert = document.getElementById('loginAlert');
                alert.textContent = data.error || 'Login failed';
                alert.classList.remove('d-none');
            }
        });

        async function autoLogin(role) {
            const res = await fetch('/auto-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ role: role })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect || '/dashboard';
            }
        }
    </script>
</body>
</html>
