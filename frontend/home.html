<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION GUARD - Home</title>
    <!-- Use similar fonts to the original image -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060b13; /* Very dark blue */
            --cyan: #3ce5e8;
            --cyan-glow: rgba(60, 229, 232, 0.4);
            --red: #ff4d4d;
            --red-glow: rgba(255, 77, 77, 0.4);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* Background particle wave image */
            background-image: url('particle_wave_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        /* Overlay to darken background image if needed */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(6,11,19,0.9) 0%, rgba(6,11,19,0.7) 50%, rgba(6,11,19,0.9) 100%);
            z-index: -1;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            z-index: 10;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .login-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .login-btn:hover {
            color: var(--text-main);
        }

        .get-started-btn {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 10px 24px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .get-started-btn:hover {
            background: rgba(60, 229, 232, 0.1);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Main Content area */
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
            padding: 0 50px;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left Side Text */
        .hero-text {
            flex: 1;
            max-width: 500px;
        }

        .subtitle {
            color: var(--cyan);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .description {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .learn-more-btn {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px var(--cyan-glow);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .learn-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(60, 229, 232, 0.6);
        }

        /* Right Side Dashboard Graphic */
        .dashboard-graphic {
            flex: 1;
            position: relative;
            max-width: 700px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-feed {
            width: 90%;
            height: 80%;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background-image: url('crowd_clean_feed.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        /* Floating Panels */
        .panel {
            position: absolute;
            background: rgba(10, 20, 35, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid var(--cyan);
            border-radius: 8px;
            padding: 15px 25px;
            box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 10px rgba(60, 229, 232, 0.1);
            color: var(--text-main);
        }

        .panel-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .panel-value {
            font-size: 36px;
            font-weight: 700;
        }

        .panel-top-left {
            top: 20px;
            left: -20px;
        }

        .panel-top-right {
            top: 20px;
            right: 0px;
        }

        .panel-bottom-left {
            bottom: 20px;
            left: -30px;
        }

        .panel-bottom-right {
            bottom: -10px;
            right: 20px;
            border-color: var(--red);
            box-shadow: 0 0 15px var(--red-glow), inset 0 0 10px rgba(255, 77, 77, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 30px;
        }

        .panel-bottom-right .status-label {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-main);
        }

        .panel-bottom-right .status-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--red);
        }

        /* Responsive adjustments */
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
                text-align: center;
                padding-top: 50px;
            }
            .nav-links {
                display: none;
            }
            .hero-text {
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    
    <nav>
        <div class="logo">VISION GUARD</div>
        <div class="nav-links">
            <a href="#">Overview</a>
            <a href="#">Featuring</a>
            <a href="#">Resources</a>
            <a href="#">Pricing</a>
        </div>
        <div class="nav-actions">
            <!-- This connects the login page as requested -->
            <a href="/login_page" class="login-btn">Log in</a>
            <a href="/login_page" class="get-started-btn">Get started</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero-text">
            <div class="subtitle">Ultra-modern AI dashboard</div>
            <h1 class="title">VISION<br>GUARD</h1>
            <div class="description">AI-Driven Stampede Prediction</div>
            <a href="/login_page" class="learn-more-btn">Learn more</a>
        </div>
        
        <div class="dashboard-graphic">
            <div class="camera-feed"></div>
            
            <div class="panel panel-top-left">
                <div class="panel-title">People Count</div>
                <div class="panel-value">52</div>
            </div>
            
            <div class="panel panel-top-right">
                <div class="panel-title">Risk Score</div>
                <div class="panel-value">78%</div>
            </div>
            
            <div class="panel panel-bottom-left">
                <div class="panel-title">Crowd Density</div>
                <div class="panel-value">71%</div>
            </div>
            
            <div class="panel panel-bottom-right">
                <div class="status-label">Status:</div>
                <div class="status-value">HIGH RISK</div>
            </div>
        </div>
    </div>
</body>
</html>
